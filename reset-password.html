<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/app.css"><title>Reset password | NILORA</title><script src="https://code.iconify.design/iconify-icon/3.0.4/iconify-icon.min.js"></script></head><body><main class="auth-wrap"><section class="auth-card"><h1>Choose a new password</h1><p>Enter your new account password.</p><div id="m" class="message"></div><form id="f"><div class="field"><label>New password</label><input id="pw" type="password" minlength="8" required></div><button class="btn">Update password</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/js/supabase.js"></script><script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.updateUser({password:document.getElementById("pw").value});const m=document.getElementById("m");m.textContent=error?error.message:"Password updated. You can sign in now.";m.className="message show "+(error?"error":"success");if(!error)setTimeout(()=>location.href="signup.html",1000)}</script></body></html>
