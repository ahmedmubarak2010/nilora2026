<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password recovery | NILORA</title><meta name="theme-color" content="#2f3d28">
<link rel="stylesheet" href="assets/css/app.css"><link rel="icon" href="Assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/3.0.4/iconify-icon.min.js"></script></head>
<body class="auth-page"><main class="auth-panel reset-panel"><section class="auth-card reset-card">
<a class="auth-mobile-brand" style="display:flex" href="index.html"><img src="Assets/logo.png" alt="">NILORA</a>
<div class="auth-card-top"><span class="auth-step">ACCOUNT SECURITY</span><span class="auth-secure"><iconify-icon icon="solar:shield-check-linear"></iconify-icon> Supabase Auth</span></div>
<div id="requestPanel"><h2>Reset your password</h2><p class="auth-intro">Enter your account email and we’ll send you a secure password reset link.</p>
<form id="requestForm"><div class="field"><label for="resetEmail">Email address</label><div class="input-shell"><iconify-icon icon="solar:letter-linear"></iconify-icon><input id="resetEmail" type="email" required autocomplete="email" placeholder="name@example.com"></div></div>
<button class="btn auth-submit" type="submit" id="requestBtn">Send reset link <iconify-icon icon="solar:arrow-right-linear"></iconify-icon></button></form></div>
<div id="updatePanel" class="hidden"><h2>Choose a new password</h2><p class="auth-intro">Your recovery link is verified. Set a new password for your NILORA account.</p>
<form id="updateForm"><div class="field"><label for="newPassword">New password</label><div class="input-shell"><iconify-icon icon="solar:lock-keyhole-linear"></iconify-icon><input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div></div>
<div class="field"><label for="confirmPassword">Confirm new password</label><div class="input-shell"><iconify-icon icon="solar:lock-password-linear"></iconify-icon><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat your password"></div></div>
<button class="btn auth-submit" type="submit" id="updateBtn">Update password <iconify-icon icon="solar:check-circle-linear"></iconify-icon></button></form></div>
<div id="resetMessage" class="message" role="status" aria-live="polite"></div>
<a class="reset-back" href="signup.html"><iconify-icon icon="solar:arrow-left-linear"></iconify-icon> Back to sign in</a>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/js/supabase.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id),msg=$("resetMessage"),show=(t,k="info")=>{msg.textContent=t;msg.className="message show "+k;};
const request=$("requestPanel"),update=$("updatePanel");
function recoveryMode(){request.classList.add("hidden");update.classList.remove("hidden");show("Recovery link verified. Choose a new password.","success");}
db.auth.getSession().then(({data,error})=>{if(error){show(error.message,"error");return;}if(data.session&&location.hash.includes("type=recovery"))recoveryMode();});
db.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)recoveryMode();});
$("requestForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("requestBtn");btn.disabled=true;try{const {error}=await db.auth.resetPasswordForEmail($("resetEmail").value.trim(),{redirectTo:location.origin+"/reset-password.html"});if(error)throw error;show("If an account exists for this email, a password reset link has been sent.","success");}catch(err){show(err.message,"error");}finally{btn.disabled=false;}});
$("updateForm").addEventListener("submit",async e=>{e.preventDefault();const a=$("newPassword").value,b=$("confirmPassword").value;if(a!==b){show("The passwords do not match.","error");return;}const btn=$("updateBtn");btn.disabled=true;try{const {error}=await db.auth.updateUser({password:a});if(error)throw error;show("Password updated. You can now sign in with your new password.","success");await db.auth.signOut();setTimeout(()=>location.href="signup.html",1200);}catch(err){show(err.message,"error");}finally{btn.disabled=false;}});
})();
</script></body></html>
