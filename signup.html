<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | NILORA</title><link rel="stylesheet" href="assets/css/app.css"><link rel="icon" href="Assets/logo.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://code.iconify.design/iconify-icon/3.0.4/iconify-icon.min.js"></script></head><body><main class="auth-wrap"><section class="auth-card"><a class="auth-brand" href="index.html"><img src="Assets/logo.png" alt="">NILORA</a><h1 id="authTitle">Welcome back</h1><p id="authSubtitle">Sign in to continue to your NILORA workspace.</p><div id="authMessage" class="message" role="status"></div><form id="authForm" data-mode="login"><div class="field hidden" id="fullNameWrap"><label>Full name</label><input id="fullName" autocomplete="name"></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password"></div><div class="field hidden" id="roleWrap"><label>Join as</label><select id="role"><option value="farmer">Farmer</option><option value="agronomist">Agronomist</option></select></div><button class="btn" id="submitBtn" type="submit">Sign in</button></form><button class="btn secondary" id="googleBtn" style="width:100%;margin-top:10px">Continue with Google</button><div style="display:flex;justify-content:space-between;gap:12px"><button id="forgotBtn" class="auth-switch">Forgot password?</button><button id="modeToggle" class="auth-switch">Create account</button></div><p>Agronomist accounts require platform approval before professional features are enabled.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/js/supabase.js"></script><script src="assets/js/auth.js"></script></body></html>
