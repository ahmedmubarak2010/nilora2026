<style>
:root{--olive:#2f3d28;--green:#556d4a;--sage:#a4ac86;--sand:#d8c9a9;--cream:#f8f6ef;--ink:#20251d;--muted:#687064;--line:#e4e3d9}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.workspace{margin-left:264px;min-height:100vh}.topbar{height:76px;position:sticky;top:0;z-index:5;background:#f8f6eff0;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.greeting{font:700 18px Montserrat;color:var(--olive)}.date{font-size:11px;color:var(--muted);margin-top:5px}.content{max-width:1600px;margin:auto;padding:26px 30px 36px;display:grid;gap:18px}.intro{display:flex;justify-content:space-between;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.16em;color:#94734e;text-transform:uppercase}.intro h1{font:800 25px Montserrat;color:var(--olive);margin:7px 0}.intro p{font-size:12px;color:var(--muted);line-height:1.7;margin:0;max-width:700px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:9px;font-size:11px;font-weight:700;border:0}.btn-primary{background:var(--olive);color:#fff}.btn-light{background:#eff1e9;color:var(--olive)}.status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:30px;background:#edf4e9;color:#3e6334;font-size:10px;font-weight:800}.status i{width:7px;height:7px;border-radius:50%;background:#5b8a4d}.assistant-shell{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 12px 32px #2f3d2810}.assistant-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 17px;background:linear-gradient(110deg,#2f3d28,#435a39);color:#fff}.assistant-brand{display:flex;align-items:center;gap:11px}.assistant-mark{width:38px;height:38px;border-radius:11px;background:#ffffff18;display:grid;place-items:center;color:#d8c9a9;font-size:22px}.assistant-brand b{display:block;font:800 13px Montserrat;letter-spacing:.04em}.assistant-brand small{display:block;color:#dce5d3;font-size:10px;margin-top:3px}.head-actions{display:flex;gap:8px}.head-actions a{padding:8px 10px;border:1px solid #ffffff35;border-radius:8px;font-size:10px;font-weight:700;color:#fff}.frame-wrap{position:relative;background:#f4f3ec;min-height:680px}.bot-frame{display:block;width:100%;height:clamp(680px,calc(100vh - 230px),900px);border:0;background:#f4f3ec}.fallback{padding:18px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7;border-top:1px solid var(--line)}.fallback a{color:var(--green);font-weight:800;text-decoration:underline}.notice{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;background:#f2efe4;border:1px solid #e5ddc9;border-radius:12px;color:#716449;font-size:11px;line-height:1.7}.notice iconify-icon{font-size:18px;flex:none}.mobile-menu{display:none}
@media(max-width:760px){.workspace{margin:58px 0 0}.topbar{height:65px;padding:0 16px}.greeting{font-size:14px}.content{padding:15px 12px 25px;gap:13px}.intro{align-items:flex-start;flex-direction:column;padding:16px}.intro h1{font-size:21px}.intro .actions{width:100%}.intro .btn{flex:1}.assistant-head{padding:11px 12px}.head-actions a{font-size:9px;padding:7px}.frame-wrap{min-height:650px}.bot-frame{height:72vh;min-height:650px}}
</style>

<main class="workspace">
<header class="topbar"><div><div class="greeting">Baraka AI</div><div class="date">Your future agricultural assistant</div></div><span class="status"><i></i> Under Development</span></header>
<div class="content">
<section class="intro" style="justify-content:center;text-align:center;min-height:390px">
<div style="max-width:650px;margin:auto">

</div>
</section>
</div>

</main>
