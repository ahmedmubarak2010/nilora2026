<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/css/app.css"><title>Signing in | NILORA</title></head><body><main class="auth-wrap"><div class="auth-card"><h1>Completing sign in…</h1><p id="s">Please wait.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/js/supabase.js"></script><script>db.auth.getSession().then(async({data,error})=>{if(error||!data.session){document.getElementById("s").textContent="Could not complete sign in. Return to login.";return}const {data:p}=await db.from("profiles").select("role,onboarding_completed").eq("id",data.session.user.id).single();location.href=!p||!p.onboarding_completed?"onboarding.html":p.role==="agronomist"?"agronomist-dashboard.html":"farmer-dashboard.html"});</script></body></html>
