<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f3d28">
<title>Baraka Robot | NILORA</title>
<meta name="description" content="Baraka Robot — coming soon.">
<link rel="icon" href="Assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/3.0.4/iconify-icon.min.js"></script>
<style>
:root{--olive:#2f3d28;--green:#556d4a;--cream:#f8f6ef;--ink:#20251d;--muted:#687064;--line:#e4e3d9}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif}.workspace{margin-left:264px;min-height:100vh}.topbar{height:76px;position:sticky;top:0;z-index:5;background:#f8f6eff0;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.greeting{font:700 18px Montserrat;color:var(--olive)}.date{font-size:11px;color:var(--muted);margin-top:5px}.content{max-width:1400px;margin:auto;padding:26px 30px}.panel{min-height:calc(100vh - 130px);background:#fff;border:1px solid var(--line);border-radius:20px;display:grid;place-items:center;text-align:center;padding:36px;box-shadow:0 12px 32px #2f3d2810}.inner{max-width:650px}.mark{width:86px;height:86px;margin:0 auto 22px;border-radius:25px;background:#eff1e9;color:var(--green);display:grid;place-items:center;font-size:43px}.eyebrow{font:800 10px Inter;letter-spacing:.18em;color:#94734e}.panel h1{font:800 34px Montserrat;color:var(--olive);margin:12px 0}.panel p{font-size:15px;line-height:2;color:var(--muted);margin:0}.status{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:10px 18px;border-radius:30px;background:#f2efe4;color:#806b45;font:800 11px Inter}.status iconify-icon{font-size:16px}
@media(max-width:760px){.workspace{margin:58px 0 0}.topbar{height:65px;padding:0 16px}.greeting{font-size:14px}.content{padding:15px 12px}.panel{min-height:calc(100vh - 100px);padding:24px 18px}.panel h1{font-size:27px}.panel p{font-size:13px}}
</style>
</head>
<body>
<main class="workspace">
<header class="topbar"><div><div class="greeting">Baraka Robot</div><div class="date">Your next-generation agricultural assistant</div></div><span class="status"><iconify-icon icon="solar:clock-circle-linear"></iconify-icon> Under Development</span></header>
<div class="content"><section class="panel"><div class="inner">
<div class="mark"><iconify-icon icon="solar:bot-linear"></iconify-icon></div>
<div class="eyebrow">COMING SOON</div>
<h1>Baraka Robot</h1>
<p>We are currently developing Baraka Robot, an intelligent assistant designed to bring a new and helpful experience to NILORA. Stay tuned for its launch!</p>
<div class="status"><iconify-icon icon="solar:code-square-linear"></iconify-icon> Under Development</div>
</div></section></div>
</main>
<script src="assets/js/shared-sidebar.js"></script>
</body>
</html>
